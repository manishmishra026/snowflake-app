name: Continuous Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: 'Target Deployment Environment'
        required: true
        options:
          - PreProd
          - Prod
        default: 'PreProd'
      component:
        type: choice
        description: 'Deploy Webapp, Function App, or Both'
        required: true
        options:
          - both
          - webapp
          - functionapp
        default: 'both'

jobs:
  deploy-webapp:
    name: Build & Deploy Webapp
    if: ${{ inputs.component == 'both' || inputs.component == 'webapp' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Frontend Application
        working-directory: frontend
        run: npm run build

      - name: Update frontend config.json with Environment Variables
        shell: python
        run: |
          import json
          import os

          possible_paths = [
              "frontend/dist/buyback-webapp/browser/assets/config/config.json",
              "frontend/dist/buyback-webapp/assets/config/config.json"
          ]

          config_path = None
          for p in possible_paths:
              if os.path.exists(p):
                  config_path = p
                  break

          if not config_path:
              if os.path.exists("frontend/dist"):
                  print("Files in frontend/dist:")
                  for root, dirs, files in os.walk("frontend/dist"):
                      print(f"  Root: {root}, Dirs: {dirs}, Files: {files}")
              raise FileNotFoundError(f"Configuration file not found in any of the expected locations: {possible_paths}")

          with open(config_path, "r") as f:
              config = json.load(f)

          config["app_insights_connection_string"] = os.environ.get("APP_INSIGHTS_CONN_STR", "")
          config["client_id"] = os.environ.get("WEB_APP_CLIENT_ID", "")
          config["tenant_id"] = os.environ.get("AZURE_TENANT_ID", "")

          backend_client_id = os.environ.get("BACKEND_API_CLIENT_ID", "")
          if backend_client_id:
              config["scopes"] = [
                  "openid",
                  "profile",
                  "email",
                  f"api://{backend_client_id}/user_impersonation"
              ]

          config["backend_url"] = ""  # Hosted together relative endpoint path

          with open(config_path, "w") as f:
              json.dump(config, f, indent=2)

          print("Successfully updated build output config.json with target environment variables:")
          print(f"  Tenant ID: {config['tenant_id']}")
          print(f"  Client ID: {config['client_id']}")
        env:
          APP_INSIGHTS_CONN_STR: ${{ vars.APPLICATIONINSIGHTS_CONNECTION_STRING }}
          WEB_APP_CLIENT_ID: ${{ vars.WEB_APP_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          BACKEND_API_CLIENT_ID: ${{ vars.BACKEND_API_CLIENT_ID }}

      - name: Copy Frontend Build to Backend Static Folder
        run: |
          mkdir -p backend/static
          if [ -d "frontend/dist/buyback-webapp/browser" ]; then
            cp -R frontend/dist/buyback-webapp/browser/* backend/static/
          else
            cp -R frontend/dist/buyback-webapp/* backend/static/
          fi
          echo "Verified files in backend/static:"
          ls -la backend/static

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ vars.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ vars.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ vars.AZURE_TENANT_ID }}"}'

      - name: Zip Backend & Static Site Package
        run: |
          cd backend
          zip -r ../backend_deploy.zip . -x ".*" ".venv/*" "tests/*" "app.log"
          cd ..

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_APP_SERVICE_NAME }}
          package: backend_deploy.zip

  deploy-functionapp:
    name: Build & Deploy Function App
    if: ${{ inputs.component == 'both' || inputs.component == 'functionapp' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ vars.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ vars.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ vars.AZURE_TENANT_ID }}"}'

      - name: Zip Function App Package
        run: |
          cd Buyback-fileprocessor
          zip -r ../function_deploy.zip . -x ".*" ".venv/*"
          cd ..

      - name: Deploy to Azure Function App
        uses: azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTION_APP_NAME }}
          package: function_deploy.zip
